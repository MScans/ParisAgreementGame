  Q('#nx').onclick=next;Q('#rs').onclick=()=>{if(TEST){location.reload();return}if(confirm('Effacer la partie en cours ?')){newGame();bus=mkT();bcast()}};
  const cu=Q('#cu');if(cu)cu.onclick=()=>{const n=prompt('Nom de la carte proposée par la classe ?');if(!n)return;const c=parseFloat((prompt('Coût en Md€ ?','1')||'').replace(',','.')),e=parseFloat((prompt('Effet en tCO2e par personne ?','0.1')||'').replace(',','.'));if(!(c>0)||!(e>=0))return;S.custom.push([1000*S.round+900+S.custom.length,n,'Carte proposée par la classe',c,e,0]);bcast()};
  const vd=Q('#vd');if(vd)vd.onclick=()=>validate(leader());
  const ex=Q('#ex');if(ex)ex.onclick=exportGame;
  const im=Q('#im'),imp=Q('#imp');if(im){im.onclick=()=>imp.click();imp.onchange=e=>{const f=e.target.files[0];if(f)f.text().then(t=>{try{importGame(JSON.parse(t))}catch(x){alert('Fichier non valide.')}})}}
  const du=Q('#dur');if(du)du.onchange=()=>{S.dur=Math.max(30,Math.round(parseFloat(du.value)*60))||120;S.t0=Date.now();bcast()};
  const rt=Q('#rt');if(rt)rt.onclick=()=>{S.t0=Date.now();bcast()};
  const mv=Q('#mv');if(mv)mv.onclick=()=>{const v=view;view=0;validate(v)};
  const mc=Q('#mc');if(mc)mc.onclick=()=>{view=0;T()};
  troot.onclick=e=>{const c=e.target.closest('[data-card]');if(c){view=+c.dataset.card;T();return}if(e.target.classList&&e.target.classList.contains('modal')){view=0;T()}};
}

// ===== Élève : une instance par élève (plusieurs sur la même page en mode test)
function q(k){return new URLSearchParams(location.search).get(k)}
function mkStudent(root,pre){
  let sb,P,me=pre||null,sel=[],key='',room='',showNew=0,declined=0,tab='v',info=0,lastJ='',lastRx=0;const R=s=>root.querySelector(s);
  const sendJoin=()=>sb.send({t:'join',id:me.id,name:me.name,fp:me.fp,c:me.c});
  const onRdy=()=>{if(!sb)return;if(me)sendJoin();else sb.send({t:'hello'})};
  function onS(m){
    if(m.t!=='state')return;lastRx=Date.now();const j=JSON.stringify(m.s);if(P&&j===lastJ)return;lastJ=j;P=m.s;if(me&&!P.st[me.id]){if(P.phase==='resume')me=null;else sendJoin()}
    const k=P.round+P.phase;if(k!==key){key=k;tab='v';sel=((me&&P.st[me.id])||{}).picks||[]}
    St();
  }
  function St(){
    if(!me){
      const HD='<div class="box" style="max-width:460px;margin:20px auto"><img class="ban" src="assets/paysage-1.webp" alt="" style="height:120px;margin:0 0 10px"><h1>Le point de bascule</h1><p><a class="btnl" href="https://nosgestesclimat.fr" target="_blank" rel="noopener">Calculer mon empreinte carbone</a></p>',old=JSON.parse(localStorage.getItem('t2-me')||'null');
      if(!sb){
        if(old&&!declined){root.innerHTML=`${HD}<p>Tu étais <b>${esc(old.name)}</b> dans la salle <b>${esc(old.room)}</b>.</p><button id="rp">Reprendre</button> <button class="alt" id="ch" style="color:var(--fg)">Changer de salle</button></div>`;
          R('#rp').onclick=()=>{me={id:old.id,name:old.name,fp:old.fp};connect(old.room)};R('#ch').onclick=()=>{declined=1;localStorage.removeItem('t2-me');St()};return}
        root.innerHTML=`${HD}<p>Puis entre le code affiché sur l’écran de l’enseignant.</p><label>Code de la salle<input id="jr" value="${esc(q('r')||'')}" maxlength="4" autocapitalize="characters"></label><button id="jb">Entrer</button><p><small>Pour tout tester sur une seule page : <a href="#test">mode test</a>.</small></p></div>`;
        R('#jb').onclick=()=>{const c=R('#jr').value.trim().toUpperCase();if(c.length!==4){alert('Le code (4 caractères) est affiché en haut de l’écran de l’enseignant.');return}connect(c)};return}
      if(!P){root.innerHTML='<div class="box" style="padding:0;overflow:hidden"><img src="assets/attente.webp" alt="Connexion…" style="display:block;width:100%"></div>';return}
      if(P.phase==='resume'&&!showNew){root.innerHTML=`${HD}<p>La partie reprend. Qui es-tu ?</p>`+Object.entries(P.st).filter(([i,s])=>!s.on).map(([i,s])=>`<button data-claim="${i}" style="display:block;width:100%;margin:4px 0">${esc(s.name)}</button>`).join('')+`<p><button class="alt" id="nw" style="color:var(--fg)">Je suis nouveau</button></p></div>`;
        root.querySelectorAll('[data-claim]').forEach(x=>x.onclick=()=>{const id=x.dataset.claim,s=P.st[id];me={id,name:s.name,fp:s.fp,c:s.c0||s.c};localStorage.setItem('t2-me',JSON.stringify({...me,room}));sb.send({t:'claim',id});St()});
        R('#nw').onclick=()=>{showNew=1;St()};return}
      root.innerHTML=`${HD}<p>Choisis un pseudo (pas de nom réel) et recopie ton résultat, <b>ligne par ligne</b>, en tonnes de CO₂e par an (813 kg = 0,813).</p><label>Pseudo<input id="jn" maxlength="16"></label>${KEYS.map(k=>`<label>${KL[k]}<input id="j_${k}" class="jc" type="text" inputmode="decimal" placeholder="ex. ${n1(FRC[k])}"></label>`).join('')}<p>Total : <b id="jt">0,0</b> t CO₂e par an</p><button id="jb">Rejoindre</button></div>`;
      const pv=k=>parseFloat((R('#j_'+k).value||'').replace(',','.')),upd=()=>{R('#jt').textContent=n1(KEYS.reduce((a,k)=>a+(pv(k)||0),0))};root.querySelectorAll('.jc').forEach(x=>x.oninput=upd);
      R('#jb').onclick=()=>{const name=R('#jn').value.trim(),c={};if(!name){alert('Choisis un pseudo.');return}for(const k of KEYS){const v=pv(k);if(!(v>=0&&v<=30)){alert('Indique « '+KL[k]+' » en tonnes (0 si rien).');return}c[k]=r2b(v)}const fp=r2b(KEYS.reduce((a,k)=>a+c[k],0));if(!(fp>=1&&fp<=40)){alert('Le total doit être compris entre 1 et 40 tonnes.');return}me={id:rid(8),name,fp,c};localStorage.setItem('t2-me',JSON.stringify({...me,room}));sendJoin();St()};return}
    if(!P){root.innerHTML='<div class="box" style="padding:0;overflow:hidden"><img src="assets/attente.webp" alt="Connexion à la salle…" style="display:block;width:100%"></div>';return}
    const mine=P.st[me.id]||{fp:me.fp,c:me.c,picks:[],used:[]},AV=avail(mine),D={...(DECKS[P.round]||DECKS[1]),ind:indOf(P.round)},head=`<div class="bar"><div><b>${esc(me.name)}</b><br><small>Mon empreinte</small> <b>${n1(mine.fp)} t</b><br><small>dont services sociétaux ${n1(mine.pub??me.fp*.18)} t, réductibles seulement par les mesures collectives</small></div><div><small>Classe</small> <b>${n1(P.hist.length?P.hist[P.hist.length-1]:me.fp)} t</b> · <small>objectif ${TARGET} t</small></div></div>`;
    let body='';
    if(P.phase==='lobby'||P.phase==='resume')body='<div class="box" style="padding:0;overflow:hidden"><img src="assets/attente.webp" alt="En attente du début de la partie" style="display:block;width:100%"></div>';
    if(P.phase==='ind'){const spent=sel.reduce((a,c)=>a+find(D.ind,c)[3],0);
      body=`<div class="box"><h2>Mes choix individuels — ${AV-spent} ♥ restants</h2><p class="who">${AV} ♥ ce tour (${HEARTS}${AV>HEARTS?` + ${AV-HEARTS} non dépensés lors des tours précédents`:''}). Les cœurs non dépensés sont reportés.</p><div class="meter"><i style="width:${Math.min(100,spent/AV*100)}%"></i></div><p><button id="ok">Valider mes choix</button> ${(mine.picks.length&&sel.join()===mine.picks.join())?'✔ envoyé':''}</p><div class="cards">`+
      D.ind.map(d=>{const on=sel.includes(d[0]),dead=!d[5]&&mine.used.includes(d[0]),no=!on&&(dead||spent+d[3]>AV);return card(d,'ind',(on?'on ':'')+(no?'off':''),`data-a="tog" data-id="${d[0]}" ${no?'data-off="1"':''}`)}).join('')+`</div></div>`}
    if(P.phase==='pres')body=`<div class="box"><h2>Les cartes du tour</h2><p class="who">Fais défiler vers la droite pour les parcourir toutes, touche « Voir les détails » pour lire les données.</p></div><div class="car">`+cols(P).map(d=>card(d,'col','',`data-a="info" data-id="${d[0]}"`,'',P)).join('')+`</div>`;
    if(P.phase==='col'){const mv=mine.votes||[],left=P.left;
      body=`<div class="box"><h2>Débat — budget restant ${eu(left)} (sur ${eu(P.budget||BUD0)})</h2><p class="who">Un seul vote : touche la carte que tu soutiens (touche-la de nouveau pour le retirer).</p><div class="cards">`+
      cols(P).map(d=>{const dead=P.used.includes(d[0])||lk(d,P)||(d[3]>left&&!mv.includes(d[0])),t=Object.values(P.st).filter(s=>(s.votes||[]).includes(d[0])).length;
        return card(d,'col',(mv.includes(d[0])?'on ':'')+(dead?'off':''),`data-a="vote" data-id="${d[0]}" ${dead?'data-off="1"':''}`,` · ${t} voix`,P)}).join('')+'</div></div>'}
    if(P.phase==='bilan'||P.phase==='fin'){
      const cur=mine.c||split(mine.fp),mi=withLive((mine.h||[]).map((c,i)=>({l:lab(i),v:c})),cur),ca=avgcX(P),cl=withLive((P.histc||[]).map((c,i)=>({l:lab(i),v:c})),ca);
      body=`<div class="box"><h2>${P.phase==='fin'?'Bilan final':'Bilan du tour '+P.round}</h2><p class="big ${mine.fp<=TARGET?'win':''}">${n1(mine.fp)} t</p><p>${mine.fp<=TARGET?'Tu es sous 2 t !':'Encore '+n1(mine.fp-TARGET)+' t à gagner pour atteindre 2 t.'} · la classe : <b>${n1(P.hist.length?P.hist[P.hist.length-1]:mine.fp)} t</b></p></div>
      <div class="box"><h2>Mon évolution</h2>${stackChart(mi.concat(refCols))}${legend()}</div>
      <div class="box"><h2>L’évolution de la classe</h2>${stackChart(cl.concat(refCols))}${legend()}</div>
      <div class="box"><h2>Catégorie par catégorie</h2>${catBars([{n:'Moi',col:'#e8604c',v:cur},{n:'Classe',col:'#26403a',v:ca},{n:'France',col:'#b3402f',v:FRC},{n:'Monde',col:'#c99700',v:WLC}])}</div>`}
    const ic=info&&(find(D.ind,info)||find(cols(P),info)),mod=ic?`<div class="modal" data-close="1"><div class="imgw">${back(ic[0])}</div><div class="side"><h2>${esc(ic[1])}</h2><p>${esc(ic[2])}</p>${ic[7]?`<p>🔒 ${esc(ic[7])}</p>`:''}<p><button class="alt" data-close="1" style="color:#fff">Fermer</button></p></div></div>`:'';
    const car0=R('.car'),sl=car0?car0.scrollLeft:0;
    root.innerHTML=head+`<img class="ban" src="assets/paysage-${stageOf(P)+1}.webp" alt=""><div style="margin-top:12px">${body}</div>`+mod;
    const car1=R('.car');if(car1)car1.scrollLeft=sl;
  }
  function connect(r){room=r;sb=makeBus(r,onS,onRdy);if(sb.ready())onRdy();St();
    // reconnexion automatique : on redemande l'état tant qu'on ne l'a pas, et on rouvre le canal au retour sur la page
    setInterval(()=>{if(!sb)return;if(!P||(me&&!P.st[me.id]))onRdy();else if(!TEST&&Date.now()-lastRx>15000&&!document.hidden){lastRx=Date.now();sb.reopen()}},3000);
    document.addEventListener('visibilitychange',()=>{if(!document.hidden&&sb&&!TEST){lastRx=Date.now();sb.reopen();if(sb.ready())onRdy()}});
    addEventListener('online',()=>{if(sb&&!TEST){sb.reopen();if(sb.ready())onRdy()}})}
  root.addEventListener('click',e=>{
    const ci=e.target.closest('[data-info]');if(ci){info=+ci.dataset.info;St();return}
    if(e.target.closest('[data-close]')&&(e.target.dataset.close||e.target.closest('button'))){info=0;St();return}
    const b=e.target.closest('button');if(!b||!me||!sb||b.dataset.off)return;
    if(b.dataset.a==='info'){info=+b.dataset.id;St();return}
    if(b.dataset.a==='tog'){const id=+b.dataset.id;sel=sel.includes(id)?sel.filter(x=>x!==id):[...sel,id];St()}
    if(b.dataset.a==='vote'){const id=+b.dataset.id,mv=(P.st[me.id]||{}).votes||[];let n=mv.includes(id)?mv.filter(x=>x!==id):[...mv,id];if(P.vpe===1&&n.length>1)n=[id];if(n.length>P.vpe)return;sb.send({t:'vote',id:me.id,cards:n})}
    if(b.id==='ok')sb.send({t:'pick',id:me.id,cards:sel});
  });
  // joue au hasard (mode test)
  function auto(){
    if(!P||!P.st[me.id])return;const mine=P.st[me.id],D={...(DECKS[P.round]||DECKS[1]),ind:indOf(P.round)};
    if(P.phase==='ind'){let left=avail(mine);const c=[];[...D.ind].sort(()=>Math.random()-.5).forEach(d=>{if(d[3]<=left&&(d[5]||!mine.used.includes(d[0]))&&Math.random()<.7){c.push(d[0]);left-=d[3]}});sel=c;sb.send({t:'pick',id:me.id,cards:c})}
    if(P.phase==='col'){const c=cols(P).filter(d=>okc(d,P)).sort(()=>Math.random()-.5).slice(0,1);sb.send({t:'vote',id:me.id,cards:c.map(d=>d[0])})}
  }
  if(pre)connect(pre.room);else St();
  return{auto};
}

// ===== Démarrage
setInterval(()=>{const e=document.getElementById('tm');if(e&&S&&S.phase==='pres'){const r=Math.max(0,(S.dur||120)-Math.floor((Date.now()-S.t0)/1000));e.textContent=r?Math.floor(r/60)+':'+String(r%60).padStart(2,'0'):'temps écoulé';e.style.color=r?'':'#e8604c'}},1000);
addEventListener('hashchange',()=>location.reload());
if(TEST){
  newGame();
  app.innerHTML=`<div id="tb"></div><div class="box" style="margin-top:14px"><button id="add">+ Un élève</button> <button id="add5" class="alt">+ 5 élèves</button> <button id="aut" class="alt">Faire jouer tous les élèves au hasard</button><p class="who">Mode test : tout se passe sur cette page, rien n’est envoyé en ligne. Les élèves sont en bas ; clique sur « Démarrer le jeu » en haut quand tu en as ajouté.</p></div><div id="sts" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px;margin-top:14px"></div>`;
  troot=$('#tb');bus=mkT();T();
  const studs=[],add=()=>{const d=document.createElement('div');d.style.cssText='max-height:560px;overflow:auto';$('#sts').append(d);
    studs.push(mkStudent(d,{id:rid(8),name:'Élève '+(studs.length+1),fp:r2(7+Math.random()*3),room:S.room}))};
  $('#add').onclick=add;$('#add5').onclick=()=>{for(let i=0;i<5;i++)add()};$('#aut').onclick=()=>studs.forEach(x=>x.auto());
  for(let i=0;i<3;i++)add();
}else if(isT){
  S=JSON.parse(localStorage.getItem('t2-S')||'null');if(!S)newGame();S.vpe=1;S.dur=S.dur||120;if(S.left==null)S.left=BUD0;if(S.budget==null)S.budget=BUD0;S.infI=S.infI||0;S.histc=S.histc||[];Object.values(S.st).forEach(x=>{x.votes=x.votes||[];ensure(x)});
  troot=app;bus=mkT();bus.send({t:'state',s:S});T();
  // battement de cœur : toutes les 4 s l'état est renvoyé, un élève qui se (re)connecte arrive tout de suite sur la bonne page
  setInterval(()=>{if(bus)bus.send({t:'state',s:S})},4000);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden&&bus&&bus.reopen)bus.reopen()});
}else mkStudent(app);
</script></body></html>
