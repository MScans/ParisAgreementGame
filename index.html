<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>2 tonnes — Atelier en classe</title>
<style>
:root{--bg:#eef1ef;--fg:#1d2b27;--gr:#26403a;--tan:#b98b63;--tl:#ecdccb;--go:#c99700;--ok:#2f8f5b;--bad:#b3402f;--card:#fff;--line:#cfd8d4}
@media(prefers-color-scheme:dark){:root{--bg:#141c19;--fg:#e6ede9;--gr:#7fb3a3;--tl:#3a2f26;--card:#1e2926;--line:#34443f}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
h1,h2,h3{margin:0 0 .4em;line-height:1.15}h1{font-size:1.5rem}h2{font-size:1.15rem}
.wrap{max-width:1200px;margin:0 auto;padding:14px}
.bar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;background:var(--gr);color:#fff;padding:12px 16px;border-radius:10px}
.bar b{font-size:1.4rem;letter-spacing:.15em}.bar small{opacity:.85}
button{font:inherit;cursor:pointer;border:0;border-radius:8px;padding:10px 16px;background:var(--tan);color:#fff;font-weight:700}
button.alt{background:transparent;border:2px solid currentColor;color:inherit}button:disabled{opacity:.4;cursor:default}
button:focus-visible,input:focus-visible{outline:3px solid var(--go);outline-offset:2px}
.grid{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:14px;margin-top:14px}
@media(max-width:820px){.grid{grid-template-columns:1fr}}
.box{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px}
.kpi{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px}.kpi div{flex:1;min-width:110px;padding:8px 10px;border-left:4px solid var(--gr)}
.kpi strong{display:block;font-size:1.6rem}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.c{border:2px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card);text-align:left;padding:0;color:inherit;font-weight:400;display:block;width:100%}
.c .t{padding:8px 10px;color:#fff;font-weight:700;background:var(--tan)}.c.col .t{background:var(--gr)}
.c .b{padding:8px 10px;font-size:.92rem}.c .f{padding:6px 10px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:6px;font-size:.9rem}
.c.on{border-color:var(--go);box-shadow:0 0 0 3px var(--go)}.c.off{opacity:.45}
.cost{font-weight:700;color:var(--tan)}.col .cost{color:var(--gr)}
.who{font-size:.8rem;opacity:.85}.pill{display:inline-block;background:var(--tl);border-radius:99px;padding:1px 8px;margin:1px;font-size:.8rem}
.meter{height:12px;background:var(--line);border-radius:6px;overflow:hidden;margin:6px 0}.meter i{display:block;height:100%;background:var(--go)}
input{font:inherit;padding:10px;border:2px solid var(--line);border-radius:8px;width:100%;background:var(--card);color:var(--fg);margin:4px 0 10px}
.big{font-size:2.2rem;font-weight:800}.win{color:var(--ok)}.lose{color:var(--bad)}
svg text{fill:var(--fg);font-size:11px}
</style></head><body><div class="wrap" id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.js"></script>
<script>
// ===== Configuration : à remplir avec votre projet Supabase (Project Settings > API). Vide = mode démo local (onglets du même navigateur).
const SB_URL= 'https://kdrranzflcglaziwgtut.supabase.co' , SB_KEY='sb_publishable_GgXZdy6igYMO9qhK_gobgw_GFc_QvnJ'; // SB_URL : https://xxxx.supabase.co   SB_KEY : clé « publishable » (sb_publishable_...)
// ===== Paramètres du jeu (valeurs de départ à ajuster)
const FR=8.2, WORLD=6.4, TARGET=2, HEARTS=8, COINS=3 /* = 3 Md€ */, PUB=1.5 /* socle services publics, t */, ROUNDS=8, BASE=.7 /* adhésion sociale de départ */;
// Cartes individuelles : [id, titre, objectif, coût ♥, effet t/pers. (estimation à valider), rejouable, influence]
// Cartes collectives : [id, titre, objectif, coût en Md€ (1 pièce $ = 1 Md€), effet t/pers., bonus d'adhésion, part de l'effet sur le socle public (0–1)]
const IND=[
[1,'Régime flexitarien','Viande et poisson 2 fois par semaine maximum',4,.5],
[2,'Remplacer la viande rouge','Toute la viande rouge remplacée par de la viande blanche',2,.25],
[3,"Moins d'œufs et de produits laitiers",'2 fois moins',1,.15],
[4,'Manger local','Distances de fret réduites de 90 %',1,.1],
[5,'Manger bio','Au moins 50 % d’aliments bio',2,.05],
[6,"Moins d'emballages",'2 fois moins d’emballages',2,.05],
[7,'Réduire ses déchets alimentaires','50 % de gaspillage en moins',2,.1,1],
[8,'Moins de boissons','2 fois moins (hors eau fraîche)',3,.1],
[9,'Se former','Lire un livre ou suivre un MOOC',1,0,1,1],
[10,'Sensibiliser son entourage','Débattre avec un ami, un collègue, un parent',1,0,1,1],
[11,'Réseaux sociaux','Informer et commenter sur le climat',1,0,1,1]];
const COL=[
[12,'Réduire les pertes alimentaires','Diviser par 2 les pertes dans chaque pays',.5,.1],
[13,'Pratiques agricoles durables','Moins d’engrais et d’émissions liées aux animaux',2,.2],
[14,'Riziculture efficiente','Rizières très efficientes : de 20 % à 60 %',.5,.01],
[15,'Préservation des espaces naturels','Fin de la destruction liée à l’expansion agricole',2,.15],
[16,'Un jour sans viande par semaine','Partout dans le monde',.5,.2],
[59,'Étendre les plans éducatifs','Éducation des filles et climat dans le supérieur',.5,0,.1]];
const DECKS={1:{ind:IND,col:COL}};
if(location.hash==='#test')for(let r=2;r<=ROUNDS;r++)DECKS[r]={ind:IND.map(d=>[d[0]+100*(r-1),...d.slice(1)]),col:COL.map(d=>[d[0]+100*(r-1),...d.slice(1)])}; // test : le tour 1 est répété 8 fois // tours suivants : ajouter ici les cartes des autres catégories

const $=s=>document.querySelector(s),app=$('#app'),r2=x=>Math.round(x*100)/100;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const n1=x=>(+x).toFixed(1).replace('.',','),n2=x=>(+x).toFixed(2).replace('.',',');
const rid=l=>Array.from({length:l},()=>'ABCDEFGHJKMNPQRSTUVWXYZ23456789'[Math.random()*31|0]).join('');
const isT=location.hash==='#prof',TEST=location.hash==='#test';let bus,S,troot;

function makeBus(room,on){
  if(TEST){(window.hub=window.hub||[]).push(on);return{send:m=>window.hub.slice().forEach(f=>f(m))}}
  if(SB_URL&&window.supabase){
    const ch=supabase.createClient(SB_URL,SB_KEY).channel('t2-'+room,{config:{broadcast:{self:true}}});
    ch.on('broadcast',{event:'m'},p=>on(p.payload)).subscribe();
    return{send:m=>ch.send({type:'broadcast',event:'m',payload:m})};
  }
  const bc=new BroadcastChannel('t2-'+room);bc.onmessage=e=>on(e.data);
  return{send:m=>{bc.postMessage(m);on(m)}};
}
const find=(a,id)=>a.find(d=>d[0]==id);
const eu=x=>String(x).replace('.',',')+' Md€',cols=X=>((DECKS[X.round]||DECKS[1]).col).concat(X.custom||[]);
const avg=()=>{const v=Object.values(S.st).map(s=>s.fp);return v.length?r2(v.reduce((a,b)=>a+b,0)/v.length):0};

// ===== Enseignant : détient l'état, les élèves envoient leurs choix
function save(){if(!TEST)localStorage.setItem('t2-S',JSON.stringify(S))}
function bcast(){save();bus.send({t:'state',s:S});T()}
function newGame(){S={room:rid(4),phase:'lobby',round:0,st:{},hist:[],used:[],ret:[],base:BASE,adopt:BASE,share:0,custom:[]};save()}
function onT(m){
  if(m.t==='join'){const o=S.st[m.id];S.st[m.id]=o?{...o,name:m.name}:{name:m.name,fp:m.fp,pub:Math.min(PUB,m.fp),picks:[],used:[],vote:0}}
  else if(m.t==='pick'&&S.phase==='ind'&&S.st[m.id]){
    const d=DECKS[S.round].ind,s=S.st[m.id],ids=[...new Set(m.cards)].filter(c=>find(d,c)&&(find(d,c)[5]||!s.used.includes(c)));
    if(ids.reduce((a,c)=>a+find(d,c)[3],0)<=HEARTS)s.picks=ids}
  else if(m.t==='vote'&&S.phase==='col'&&S.st[m.id]){if(!S.used.includes(m.card))S.st[m.id].vote=m.card}
  else return;
  bcast();
}
function tally(){const t={};Object.values(S.st).forEach(s=>{if(s.vote)(t[s.vote]=t[s.vote]||[]).push(s.name)});return t}
function retain(){const t=tally();let left=COINS,r=[];
  cols(S).filter(d=>t[d[0]]).sort((a,b)=>t[b[0]].length-t[a[0]].length||a[3]-b[3]).forEach(d=>{if(d[3]<=left){left-=d[3];r.push(d[0])}});return r}
function next(){
  const ids=Object.keys(S.st),D=DECKS[S.round]||{};
  if(S.phase==='lobby'&&ids.length){S.hist=[avg()];S.round=1;S.phase='ind'}
  else if(S.phase==='ind'){ids.forEach(i=>{const s=S.st[i];s.picks.forEach(c=>{const d=find(D.ind,c);s.fp=Math.max(s.pub,r2(s.fp-d[4]));if(!d[5])s.used.push(c)});s.inf=s.picks.some(c=>find(D.ind,c)[6]);s.picks=[]});
    S.share=ids.length?ids.filter(i=>S.st[i].inf).length/ids.length:0;S.adopt=r2(S.base+(1-S.base)*S.share);S.phase='col'}
  else if(S.phase==='col'){const r=retain();r.forEach(c=>{const d=find(cols(S),c);const e=r2(d[4]*S.adopt);ids.forEach(i=>{const s=S.st[i];s.pub=Math.max(0,r2(s.pub-e*(d[6]||0)));s.fp=Math.max(s.pub,r2(s.fp-e))});S.base=Math.min(.95,r2(S.base+(d[5]||0)));S.used.push(c)});
    ids.forEach(i=>S.st[i].vote=0);S.ret=r;S.hist.push(avg());S.phase=DECKS[S.round+1]?'bilan':'fin'}
  else if(S.phase==='bilan'){S.round++;S.custom=[];S.phase='ind'}
  else return;
  bcast();
}
function chart(h,st){
  const W=560,H=270,L=34,B=28,top=12,n=Math.max(h.length,2),mx=Math.max(FR+1,...h,...st.map(s=>s.fp)),
  X=i=>L+i*(W-L-14)/(n-1),Y=v=>top+(H-top-B)*(1-v/mx);
  const line=(v,c,l)=>`<line x1="${L}" x2="${W-14}" y1="${Y(v)}" y2="${Y(v)}" stroke="${c}" stroke-dasharray="5 4"/><text x="${W-16}" y="${Y(v)-4}" text-anchor="end">${l}</text>`;
  const pts=h.map((v,i)=>`${X(i)},${Y(v)}`).join(' ');
  return`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Empreinte carbone par tour">
  ${[0,2,4,6,8,10].filter(v=>v<=mx).map(v=>`<text x="${L-6}" y="${Y(v)+4}" text-anchor="end">${v}</text>`).join('')}
  ${line(FR,'#b3402f','France '+n1(FR)+' t')}${line(WORLD,'#c99700','Monde '+n1(WORLD)+' t')}${line(TARGET,'#2f8f5b','Objectif '+TARGET+' t')}
  ${h.length>1?`<polyline points="${pts}" fill="none" stroke="#26403a" stroke-width="3"/>`:''}
  ${st.map((s,k)=>`<circle cx="${X(h.length-1)+((k%5)-2)*5}" cy="${Y(s.fp)}" r="3.5" fill="#b98b63" opacity=".8"/>`).join('')}
  ${h.map((v,i)=>`<circle cx="${X(i)}" cy="${Y(v)}" r="5" fill="#26403a"/><text x="${X(i)}" y="${H-8}" text-anchor="middle">${i?'Tour '+i:'Départ'}</text>`).join('')}</svg>`;
}
function card(d,type,extra,att){
  return`<button class="c ${type} ${extra||''}" ${att||''}><div class="t">${esc(d[1])}</div><div class="b">${esc(d[2])}</div>
  <div class="f"><span class="cost">${type==='col'?eu(d[3]):'♥'.repeat(d[3])}</span><span>${d[4]?'−'+n2(d[4])+' t':(type==='col'?'adhésion +'+Math.round((d[5]||0)*100)+' %':'influence')}${type==='ind'&&d[5]?' · rejouable':''}</span></div></button>`;
}
function T(){
  const ids=Object.keys(S.st),st=ids.map(i=>S.st[i]),a=avg(),ok=st.filter(s=>s.fp<=TARGET).length,D=DECKS[S.round]||DECKS[1];
  const label={lobby:'Démarrer le jeu',ind:'Clore les choix individuels',col:'Valider le vote collectif',bilan:'Tour suivant',fin:'Partie terminée'}[S.phase];
  const url=location.href.split('#')[0].split('?')[0]+'?r='+S.room;let side='';
  if(S.phase==='lobby')side=`<h2>Élèves connectés (${ids.length})</h2>`+st.map(s=>`<span class="pill">${esc(s.name)} · ${n1(s.fp)} t</span>`).join('')||'';
  if(S.phase==='ind')side=`<h2>Choix individuels</h2><p>${st.filter(s=>s.picks.length).length} / ${st.length} élèves ont validé.</p>`+st.map(s=>`<span class="pill">${s.picks.length?'✔ ':''}${esc(s.name)}</span>`).join('');
  if(S.phase==='col'){const t=tally(),r=retain(),used=r.reduce((x,c)=>x+find(cols(S),c)[3],0);
    side=`<h2>Débat collectif — budget ${used} / ${COINS} Md€</h2><div class="meter"><i style="width:${used/COINS*100}%"></i></div><div class="cards">`+
    cols(S).map(d=>`<div class="c col ${r.includes(d[0])?'on':''} ${S.used.includes(d[0])?'off':''}"><div class="t">${esc(d[1])}</div><div class="b">${esc(d[2])}</div><div class="f"><span class="cost">${eu(d[3])}</span><span><b>${(t[d[0]]||[]).length}</b> voix</span></div><div class="b who">${(t[d[0]]||[]).map(esc).join(', ')}</div></div>`).join('')+'</div><p class="who">Surlignées : cartes retenues dans la limite du budget.</p>'}
  if(S.phase==='bilan'||S.phase==='fin')side=`<h2>Bilan du tour ${S.round}</h2><p>Mesures collectives adoptées :</p>`+(S.ret.length?S.ret.map(c=>`<p>✔ ${esc(find(cols(S),c)[1])} (−${n2(find(cols(S),c)[4]*(S.adopt||1))} t)</p>`).join(''):'<p>Aucune.</p>')+
    (S.phase==='fin'?`<p class="big ${a<=TARGET?'win':'lose'}">${a<=TARGET?'La classe atteint 2 t !':'Moyenne de classe : '+n1(a)+' t'}</p><p>${ok} / ${st.length} élèves sous 2 t. ${a<=TARGET&&ok==st.length?'<b class="win">Double victoire !</b>':''}</p><p class="who">Cartes des autres catégories à ajouter pour poursuivre jusqu’en 2050.</p>`:'');
  troot.innerHTML=`<div class="bar"><div><small>Code de la salle</small><br><b>${S.room}</b></div><div><small>Les élèves ouvrent</small><br><a href="${esc(url)}" target="_blank" rel="noopener" style="color:#fff">${esc(url)}</a>${SB_URL?'':'<br><small>Mode démo : ouvre ce lien dans un autre onglet du même navigateur.</small>'}</div>
  <div><button id="nx" ${S.phase==='fin'||(S.phase==='lobby'&&!ids.length)?'disabled':''}>${label}</button> ${S.phase==='col'?'<button class="alt" id="cu">Carte maison</button> ':''}<button class="alt" id="rs">Nouvelle partie</button></div></div>
  <div class="grid"><div class="box"><div class="kpi"><div><small>Moyenne de la classe</small><strong>${n1(a)} t</strong></div><div><small>Élèves sous ${TARGET} t</small><strong>${ok} / ${st.length}</strong></div><div><small>Tour</small><strong>${S.round||'—'} / ${ROUNDS}</strong></div><div><small>Adhésion sociale</small><strong>${Math.round((S.phase==='lobby'?S.base:S.adopt)*100)} %</strong></div><div><small>Socle public (moy.)</small><strong>${n1(st.length?st.reduce((x,s)=>x+s.pub,0)/st.length:PUB)} t</strong></div></div>${chart(S.hist.length?S.hist:[a],st)}</div>
  <div class="box">${side}</div></div>`;
  troot.querySelector('#nx').onclick=next;
  const cu=troot.querySelector('#cu');if(cu)cu.onclick=()=>{const n=prompt('Nom de la carte proposée par la classe ?');if(!n)return;const c=parseFloat((prompt('Coût en Md€ ?','1')||'').replace(',','.')),e=parseFloat((prompt('Effet en tCO2e par personne ?','0.1')||'').replace(',','.'));if(!(c>0)||!(e>=0))return;S.custom.push([1000*S.round+900+S.custom.length,n,'Carte proposée par la classe',c,e,0]);bcast()};troot.querySelector('#rs').onclick=()=>{if(TEST){location.reload();return}if(confirm('Effacer la partie en cours ?')){newGame();bus=makeBus(S.room,onT);bcast()}};
}

// ===== Élève : une instance par élève (plusieurs sur la même page en mode test)
function q(k){return new URLSearchParams(location.search).get(k)}
function mkStudent(root,pre){
  let sb,P,me=pre||null,sel=[],key='';const R=s=>root.querySelector(s);
  const sendJoin=()=>sb.send({t:'join',id:me.id,name:me.name,fp:me.fp});
  function onS(m){
    if(m.t!=='state')return;P=m.s;if(!P.st[me.id])sendJoin();
    const k=P.round+P.phase;if(k!==key){key=k;sel=(P.st[me.id]||{}).picks||[]}
    St();
  }
  function St(){
    if(!me){const r=q('r')||'';root.innerHTML=`<div class="box" style="max-width:460px;margin:20px auto"><h1>2 tonnes</h1><p>Calcule ton empreinte carbone sur <a href="https://nosgestesclimat.fr" target="_blank" rel="noopener">nosgestesclimat.fr</a>, puis rejoins la partie.</p>
    <p><small>Le code de la salle est affiché sur l’écran de l’enseignant. Pour tout tester sur une seule page : <a href="#test">mode test</a>.</small></p>
    <label>Code de la salle<input id="jr" value="${esc(r)}" maxlength="4" autocapitalize="characters"></label>
    <label>Pseudo (pas de nom réel)<input id="jn" maxlength="16"></label>
    <label>Mon empreinte (tonnes CO₂e par an)<input id="jf" type="number" step="0.1" min="1" max="40" inputmode="decimal"></label>
    <button id="jb">Rejoindre</button></div>`;
      R('#jb').onclick=()=>{const room=R('#jr').value.trim().toUpperCase(),name=R('#jn').value.trim(),fp=parseFloat(R('#jf').value.replace(',','.'));
        if(room.length!==4){alert('Le code de la salle (4 caractères) est affiché en haut de l’écran de l’enseignant.');return}
        if(!name){alert('Choisis un pseudo.');return}
        if(!(fp>=1&&fp<=40)){alert('Indique ton empreinte, entre 1 et 40 tonnes.');return}
        me={id:rid(8),name,fp};localStorage.setItem('t2-me',JSON.stringify({...me,room}));connect(room)};return}
    if(!P){root.innerHTML='<div class="box"><p>Connexion à la salle…</p></div>';return}
    const mine=P.st[me.id]||{fp:me.fp,picks:[],used:[]},D=DECKS[P.round]||DECKS[1],head=`<div class="bar"><div><b>${esc(me.name)}</b><br><small>Mon empreinte</small> <b>${n1(mine.fp)} t</b><br><small>dont socle public ${n1(mine.pub??Math.min(PUB,me.fp))} t, réductible seulement par les mesures collectives</small></div><div><small>Classe</small> <b>${n1(P.hist.length?P.hist[P.hist.length-1]:me.fp)} t</b> · <small>objectif ${TARGET} t</small></div></div>`;
    let body='';
    if(P.phase==='lobby')body='<div class="box"><p>En attente du démarrage par l’enseignant…</p></div>';
    if(P.phase==='ind'){const spent=sel.reduce((a,c)=>a+find(D.ind,c)[3],0);
      body=`<div class="box"><h2>Mes choix individuels — ${HEARTS-spent} ♥ restants</h2><div class="meter"><i style="width:${spent/HEARTS*100}%"></i></div><div class="cards">`+
      D.ind.map(d=>{const on=sel.includes(d[0]),dead=!d[5]&&mine.used.includes(d[0]),no=!on&&(dead||spent+d[3]>HEARTS);return card(d,'ind',(on?'on ':'')+(no?'off':''),`data-a="tog" data-id="${d[0]}" ${no?'disabled':''}`)}).join('')+
      `</div><p><button id="ok">Valider mes choix</button> ${(mine.picks.length&&sel.join()===mine.picks.join())?'✔ envoyé':''}</p></div>`}
    if(P.phase==='col'){const t={};Object.values(P.st).forEach(s=>{if(s.vote)t[s.vote]=(t[s.vote]||0)+1});
      body=`<div class="box"><h2>Débat : pose ton vote sur une carte (budget ${COINS} Md€)</h2><div class="cards">`+
      cols(P).map(d=>{const dead=P.used.includes(d[0]);return card(d,'col',(mine.vote==d[0]?'on ':'')+(dead?'off':''),`data-a="vote" data-id="${d[0]}" ${dead?'disabled':''}`).replace('</span></div></button>',` · ${t[d[0]]||0} voix</span></div></button>`)}).join('')+'</div></div>'}
    if(P.phase==='bilan'||P.phase==='fin')body=`<div class="box"><h2>Bilan du tour ${P.round}</h2><p class="big ${mine.fp<=TARGET?'win':''}">${n1(mine.fp)} t</p><p>${mine.fp<=TARGET?'Tu es sous 2 t !':'Encore '+n1(mine.fp-TARGET)+' t à gagner pour atteindre 2 t.'}</p></div>`;
    root.innerHTML=head+`<div style="margin-top:12px">${body}</div>`;
  }
  function connect(room){sb=makeBus(room,onS);sendJoin();St()}
  root.addEventListener('click',e=>{
    const b=e.target.closest('button');if(!b||!me||!sb)return;
    if(b.dataset.a==='tog'){const id=+b.dataset.id;sel=sel.includes(id)?sel.filter(x=>x!==id):[...sel,id];St()}
    if(b.dataset.a==='vote')sb.send({t:'vote',id:me.id,card:+b.dataset.id});
    if(b.id==='ok')sb.send({t:'pick',id:me.id,cards:sel});
  });
  // joue au hasard (mode test)
  function auto(){
    if(!P||!P.st[me.id])return;const mine=P.st[me.id],D=DECKS[P.round]||DECKS[1];
    if(P.phase==='ind'){let left=HEARTS;const c=[];[...D.ind].sort(()=>Math.random()-.5).forEach(d=>{if(d[3]<=left&&(d[5]||!mine.used.includes(d[0]))&&Math.random()<.7){c.push(d[0]);left-=d[3]}});sel=c;sb.send({t:'pick',id:me.id,cards:c})}
    if(P.phase==='col'){const c=cols(P).filter(d=>!P.used.includes(d[0]));if(c.length)sb.send({t:'vote',id:me.id,card:c[Math.random()*c.length|0][0]})}
  }
  if(pre)connect(pre.room);
  else{const old=JSON.parse(localStorage.getItem('t2-me')||'null');
    if(old&&(!q('r')||q('r')===old.room)){me={id:old.id,name:old.name,fp:old.fp};connect(old.room)}else St()}
  return{auto};
}

  troot=$('#tb');bus=makeBus(S.room,onT);T();

  $('#add').onclick=add;$('#add5').onclick=()=>{for(let i=0;i<5;i++)add()};$('#aut').onclick=()=>studs.forEach(x=>x.auto());
